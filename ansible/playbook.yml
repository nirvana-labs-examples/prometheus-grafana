---
- name: Deploy Prometheus and Grafana Monitoring Stack
  hosts: monitoring
  become: yes
  vars:
    prometheus_version: "2.50.1"
    node_exporter_version: "1.7.0"
    grafana_admin_password: "{{ lookup('password', '/tmp/grafana_password length=16 chars=ascii_letters,digits') }}"
    prometheus_port: 9090
    grafana_port: 3000
    node_exporter_port: 9100
    prometheus_data_dir: "/var/lib/prometheus"
    prometheus_config_dir: "/etc/prometheus"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - software-properties-common
        state: present

    # Node Exporter Installation
    - name: Create node_exporter user
      user:
        name: node_exporter
        system: yes
        shell: /bin/false
        create_home: no

    - name: Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install Node Exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: yes
        mode: '0755'
        owner: root
        group: root

    - name: Create Node Exporter systemd service
      copy:
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'
      notify: Reload systemd

    - name: Start Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

    # Prometheus Installation
    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/false
        create_home: no

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - "{{ prometheus_config_dir }}"
        - "{{ prometheus_data_dir }}"

    - name: Download Prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install Prometheus binaries
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: /usr/local/bin/{{ item }}
        remote_src: yes
        mode: '0755'
        owner: root
        group: root
      loop:
        - prometheus
        - promtool

    - name: Copy console files
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "{{ prometheus_config_dir }}/{{ item }}"
        remote_src: yes
        owner: prometheus
        group: prometheus
      loop:
        - consoles
        - console_libraries

    - name: Configure Prometheus
      template:
        src: prometheus.yml.j2
        dest: "{{ prometheus_config_dir }}/prometheus.yml"
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: Restart Prometheus

    - name: Create Prometheus systemd service
      copy:
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file={{ prometheus_config_dir }}/prometheus.yml \
            --storage.tsdb.path={{ prometheus_data_dir }} \
            --web.console.templates={{ prometheus_config_dir }}/consoles \
            --web.console.libraries={{ prometheus_config_dir }}/console_libraries \
            --web.listen-address=0.0.0.0:{{ prometheus_port }} \
            --storage.tsdb.retention.time=15d
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/prometheus.service
        mode: '0644'
      notify:
        - Reload systemd
        - Restart Prometheus

    - name: Start Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes

    # Grafana Installation
    - name: Add Grafana GPG key
      shell: |
        curl -fsSL https://apt.grafana.com/gpg.key | gpg --dearmor -o /usr/share/keyrings/grafana.gpg --yes

    - name: Add Grafana repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        state: present
        filename: grafana

    - name: Install Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Remove Grafana sample provisioning files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/grafana/provisioning/datasources/sample.yaml
        - /etc/grafana/provisioning/dashboards/sample.yaml
        - /etc/grafana/provisioning/access-control/sample.yaml
        - /etc/grafana/provisioning/alerting/sample.yaml
        - /etc/grafana/provisioning/plugins/sample.yaml

    - name: Configure Grafana
      template:
        src: grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Configure Prometheus datasource for Grafana
      template:
        src: datasource.yml.j2
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Configure dashboard provisioning
      template:
        src: dashboards.yml.j2
        dest: /etc/grafana/provisioning/dashboards/default.yml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Create dashboards directory
      file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'

    - name: Copy Node Exporter dashboard
      copy:
        src: dashboards/node-exporter.json
        dest: /var/lib/grafana/dashboards/node-exporter.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: Restart Grafana

    - name: Start Grafana
      systemd:
        name: grafana-server
        state: started
        enabled: yes

    - name: Wait for Grafana to be ready
      wait_for:
        port: "{{ grafana_port }}"
        delay: 5
        timeout: 60

    - name: Wait for Prometheus to be ready
      wait_for:
        port: "{{ prometheus_port }}"
        delay: 2
        timeout: 30

    - name: Save credentials to file
      copy:
        content: |
          Monitoring Stack Credentials
          ============================
          Grafana URL: http://{{ ansible_host }}:{{ grafana_port }}
          Username: admin
          Password: {{ grafana_admin_password }}

          Prometheus URL: http://{{ ansible_host }}:{{ prometheus_port }}
        dest: /root/monitoring_credentials.txt
        mode: '0600'

    - name: Display deployment info
      debug:
        msg: |
          ================================================
          Monitoring Stack Deployed!
          ================================================
          Grafana URL: http://{{ ansible_host }}:{{ grafana_port }}
          Username: admin
          Password: {{ grafana_admin_password }}

          Prometheus URL: http://{{ ansible_host }}:{{ prometheus_port }}

          Node Exporter: http://{{ ansible_host }}:{{ node_exporter_port }}/metrics

          Credentials saved to: /root/monitoring_credentials.txt
          ================================================

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted

    - name: Restart Grafana
      systemd:
        name: grafana-server
        state: restarted
